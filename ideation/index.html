<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<script src="../commun/theme-tot.js"></script>
<link rel="preload" href="../commun/fonts/venus-rising.otf" as="font" type="font/otf" crossorigin>
<link rel="preload" href="../commun/fonts/norelli-black.otf" as="font" type="font/otf" crossorigin>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../media/icone-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Showrunner">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0a0d0b">
<title>Idéation · SHOWRUNNER TOOLS</title>
<meta name="description" content="Le canvas d'idéation : des planches où l'on pose, rapproche et fait naître des idées visuelles avant la production.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23e0674a'/%3E%3Crect x='12' y='12' width='8' height='8' rx='2' fill='%23170c08'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Azeret+Mono:wght@300;400;500&display=swap">
<link rel="stylesheet" href="../commun/tokens.css">
<link rel="stylesheet" href="../commun/base.css">
<link rel="stylesheet" href="../commun/shell.css">
<link rel="stylesheet" href="./ideation.css">
<link rel="stylesheet" href="./barres.css">
<script type="module" blocking="render" src="./ideation.js"></script>
</head>
<body class="ide-page">
<main class="ide">

  <!-- deux barres, comme Miro (Cal, 30/09 ; help.miro.com, « Toolbars ») : en haut, la
       gestion de la planche (son nom, l'export, présenter, l'atelier, la collaboration) ;
       à gauche, sur la planche, les outils qui y posent (ideation/barres.css) -->
  <div class="ide-bar">
    <button class="tb ghost sm" id="b-boards" type="button" title="ouvrir, renommer, dupliquer une planche">Planches</button>
    <button class="tb ghost sm cmp" id="b-new" type="button" title="une planche neuve" aria-label="nouvelle planche"><span class="bi"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span><span class="bt">Nouvelle</span></button>
    <label class="pname" title="le nom de la planche (elle s'enregistre seule)">
      <span class="k">planche</span>
      <input id="b-name" class="nm" value="" spellcheck="false" aria-label="nom de la planche" maxlength="120">
    </label>
    <span class="pill" id="save-st" title="la planche s'enregistre seule à chaque geste"><i></i><span>—</span></span>
    <!-- annuler, rétablir : avec la planche (Miro les pose sous sa barre de création ; sur un
         écran de 13 pouces, la barre de gauche n'aurait plus la place de tout montrer) -->
    <div class="tgrp" role="toolbar" aria-label="annuler">
      <button class="ic" id="b-undo" type="button" title="annuler · ctrl+Z"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
      <button class="ic" id="b-redo" type="button" title="rétablir · ctrl+maj+Z"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
    </div>
    <span class="sp"></span>
    <span id="exp-st" hidden></span>
    <button class="tb ghost sm cmp" id="b-export" type="button"><span class="bi"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></span><span class="bt">Exporter</span></button>
    <button class="ic" id="b-help" type="button" title="les raccourcis">?</button>
  </div>

  <div class="warn conflict" id="conflict" hidden>
    <span>cette planche a été modifiée ailleurs (un autre onglet ?) — vos derniers gestes ne sont pas enregistrés.</span>
    <button class="tb ghost sm" id="c-reload" type="button">Recharger celle du serveur</button>
    <button class="tb ghost sm" id="c-force" type="button">Garder la mienne</button>
  </div>

  <!-- la bibliothèque : le panneau Asset commun, à gauche de la page (commun/dock.js, library.js) -->
  <div class="ide-main">
    <section class="cv" id="cv" aria-label="la planche" tabindex="-1">
  <!-- la barre des outils, verticale, sur la planche -->
  <nav class="ide-bar ide-side" aria-label="outils de la planche">
    <div class="tgrp" id="tools" role="toolbar" aria-label="outils">
      <button class="ic" data-tool="select" type="button" title="choisir, déplacer · V"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 2-2 6z"/></svg></button>
      <button class="ic" data-tool="hand" type="button" title="se déplacer · H (ou espace + glisser)"><svg viewBox="0 0 24 24"><path d="M7 11V6a1.5 1.5 0 0 1 3 0v5V4a1.5 1.5 0 0 1 3 0v7V6a1.5 1.5 0 0 1 3 0v9a5 5 0 0 1-5 5H9l-4-5"/></svg></button>
      <button class="ic" data-tool="link" type="button" title="une flèche d’annotation entre deux objets · L (les fils partent des sorties)"><svg viewBox="0 0 24 24"><path d="M9 15l6-6M7 17a3 3 0 0 1 0-4l2-2M17 7a3 3 0 0 1 0 4l-2 2"/></svg></button>
    </div>
    <div class="tgrp" role="toolbar" aria-label="poser">
      <button class="ic" data-tool="note" type="button" title="une note · N"><svg viewBox="0 0 24 24"><path d="M5 4h11l4 4v12H5zM16 4v4h4M8 12h8M8 16h5"/></svg></button>
      <button class="ic" data-tool="sticky" type="button" title="un post-it · S"><svg viewBox="0 0 24 24"><path d="M4 4h16v11l-5 5H4zM15 20v-5h5"/></svg></button>
      <button class="ic" data-tool="title" type="button" title="un titre · T"><svg viewBox="0 0 24 24"><path d="M5 6h14M12 6v13"/></svg></button>
      <button class="ic" data-tool="frame" type="button" title="un cadre : tracer une zone · F"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
      <button class="ic" data-tool="compose" type="button" title="un composeur de prompt : Style, Personnages, Action, Décor, Photographie · P"><svg viewBox="0 0 24 24"><path d="M4 5h9M4 10h13M4 15h7M4 20h11M17 14l3 3-3 3"/></svg></button>
      <button class="ic" data-tool="gen" type="button" title="une carte Générer image · G"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/></svg></button>
      <button class="ic" data-tool="vgen" type="button" title="une carte Générer vidéo · M"><svg viewBox="0 0 24 24"><path d="M3 6h13v12H3zM16 10l5-3v10l-5-3"/></svg></button>
    </div>
    <!-- les médias (objets/medias.js) : un son de la bibliothèque ou du disque, une adresse web -->
    <div class="tgrp" role="toolbar" aria-label="médias">
      <button class="ic" id="b-son" type="button" title="un son : la bibliothèque, ou le disque · A"><svg viewBox="0 0 24 24"><path d="M3 12h2M7 8v8M11 5v14M15 9v6M19 7v10M21 12h0"/></svg></button>
      <button class="ic" id="b-web" type="button" title="une adresse web : YouTube, Vimeo, un site · W"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg></button>
    </div>
    <div class="tgrp" role="toolbar" aria-label="bibliothèque">
      <button class="ic on" id="b-lib" type="button" title="la bibliothèque : le panneau Asset · Ctrl+Espace" aria-controls="sr-dock"><svg viewBox="0 0 24 24"><path d="M4 5h5v14H4zM11 5h4v14h-4zM17 6l3 .8-3.2 12.4-3-.8"/></svg></button>
    </div>
  </nav>
    </section>
    <aside class="insp" id="insp" aria-label="inspecteur"></aside>
  </div>
</main>
</body>
</html>
