<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
<!-- L'accueil (docs/etudes/positionnement.md § 5, apps_studio_elements.md
     § 3.7) : le titre et la seule action orange, la bibliothèque ; reprendre
     (Studio) ; A les Apps ; B le Studio ; C les derniers assets ; les
     machines en pied. Tout est dessiné par accueil.js depuis TOOLS
     (commun/shell.js), la seule liste. -->
<main class="acc">
  <section class="acc-top">
    <div class="acc-hero">
      <span class="acc-ref">00_PORTAIL</span>
      <!-- Norelli : lettres et espaces seulement -->
      <h1 class="acc-title">Showrunner</h1>
      <p class="acc-lede">images, vidéos, musique, montage, planches : les itérations se fabriquent ici, liées entre elles.</p>
      <div class="row" id="acc-acts"></div>
    </div>
  </section>

  <section class="acc-sect" id="acc-resume" aria-labelledby="acc-h-resume" hidden>
    <div class="acc-head"><h2 id="acc-h-resume">Reprendre</h2><span class="acc-key">R</span></div>
    <div class="acc-chips" id="acc-chips"></div>
  </section>

  <section class="acc-sect acc-apps" aria-labelledby="acc-h-apps">
    <div class="acc-head"><h2 id="acc-h-apps">Apps</h2><span class="acc-key">A</span><span class="acc-tag">faire et éditer un média, seul, vite</span></div>
    <div class="acc-big" id="acc-big"></div>
    <div class="acc-row" id="acc-row"></div>
  </section>

  <section class="acc-sect acc-studio" aria-labelledby="acc-h-studio">
    <div class="acc-head"><h2 id="acc-h-studio">Studio</h2><span class="acc-key">B</span><span class="acc-tag">les outils liés par les éléments</span></div>
    <p class="why acc-why" id="acc-why" hidden></p>
    <div class="acc-grid" id="acc-studio"></div>
  </section>

  <section class="acc-sect" id="acc-assets" aria-labelledby="acc-h-assets" hidden>
    <div class="acc-head"><h2 id="acc-h-assets">Derniers assets</h2><span class="acc-key">C</span><a class="lbl acc-more" href="./asset/">tout voir</a></div>
    <div class="acc-strip" id="acc-strip"></div>
  </section>

  <footer class="acc-sys" id="acc-sys" aria-label="les machines"></footer>
</main>
<script type="module" src="./accueil.js"></script>
</body>
</html>
