<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<script src="../commun/theme-tot.js"></script>
<link rel="preload" href="../commun/fonts/venus-rising.otf" as="font" type="font/otf" crossorigin>
<link rel="preload" href="../commun/fonts/norelli-black.otf" as="font" type="font/otf" crossorigin>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IMAGE · SHOWRUNNER TOOLS</title>
<meta name="description" content="Créer des images photo : Z-Image, Qwen-Image 2.1, Krea 2 ; caméra, objectif, pellicule, lumière ; le fil des images et sa barre de prompt. Éditer : l'atelier.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23e0674a'/%3E%3Crect x='12' y='12' width='8' height='8' rx='2' fill='%23170c08'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Azeret+Mono:wght@300;400;500&display=swap">
<link rel="stylesheet" href="../commun/tokens.css">
<link rel="stylesheet" href="../commun/base.css">
<link rel="stylesheet" href="../commun/shell.css">
<link rel="stylesheet" href="../commun/menu.css" data-sr-menu>
<link rel="stylesheet" href="../commun/fil.css">
<link rel="stylesheet" href="./image.css">
<script type="module" blocking="render" src="./image.js"></script>
</head>
<body>
<!-- Sur le modèle de la page image de Higgsfield (capture 2 de Cal, 29/09) : le fil
     en grille sur toute la largeur, la barre de prompt flottante en bas. -->
<main class="img-page" aria-label="le fil des images">
  <!-- Créer / Éditer : la page arrive toujours en Créer ; Éditer ouvre l'atelier (image/atelier/) -->
  <nav class="im-mode seg" aria-label="créer ou éditer">
    <a class="tb on" aria-current="page" href="./">Créer</a>
    <a class="tb" id="mode-edit" href="atelier/">Éditer</a>
  </nav>
  <div id="banner"></div>
  <div id="fil"></div>
</main>
<section class="pbar" id="pbar" aria-label="la barre de prompt">
  <div class="pb-pop" id="pop" hidden></div>
  <div class="pb-main">
    <p class="pb-note" id="pb-note" hidden></p>
    <div class="pb-refs" id="pb-refs"></div>
    <div class="pb-text" id="pb-text">
      <textarea class="pb-ta" id="prompt" rows="1" spellcheck="false" aria-label="le prompt"></textarea>
      <div class="pb-at" id="pb-at" hidden></div>
    </div>
    <div class="pb-chips" id="pb-chips"></div>
  </div>
  <div class="pb-go" id="act"></div>
</section>
<script type="module" src="./image.js"></script>
</body>
</html>
