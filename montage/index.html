<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Montage · SHOWRUNNER TOOLS</title>
<meta name="description" content="Le banc de montage : chutier, moniteurs source et programme, timeline multipiste, outils de Premiere, LUT, export MP4.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23e0674a'/%3E%3Crect x='12' y='12' width='8' height='8' rx='2' fill='%23170c08'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Azeret+Mono:wght@300;400;500&display=swap">
<link rel="stylesheet" href="../commun/tokens.css">
<link rel="stylesheet" href="../commun/base.css">
<link rel="stylesheet" href="../commun/shell.css">
<link rel="stylesheet" href="./montage.css">
<script type="module" src="./montage.js"></script>
</head>
<body class="mtg-page">
<main class="mtg" id="mtg">

  <!-- la barre : le projet, le transport, le temps, l'export -->
  <div class="mtg-bar">
    <button class="tb ghost sm" id="b-projects">Séquences</button>
    <label class="pname">
      <span class="k">séquence</span>
      <input id="p-name" class="nm" value="" spellcheck="false" aria-label="nom de la séquence">
    </label>
    <span class="pill save" id="save-st"><i></i><span>—</span></span>
    <span class="sp"></span>
    <span class="tgrp sr-undo" id="undo-box" role="group" aria-label="annuler, rétablir, le journal des gestes"></span>
    <div class="tgrp transport-mini" aria-label="lecture du programme">
      <button class="pb" id="p-home" title="Origine">|◀</button>
      <button class="pb" id="p-prev" title="←">◀</button>
      <button class="pb play" id="p-play" title="espace · J K L">Lecture</button>
      <button class="pb" id="p-next" title="→">▶</button>
      <button class="pb" id="p-end" title="Fin">▶|</button>
    </div>
    <div class="tcbox">
      <span><small>timecode</small><b id="tc" class="tcv">00:00:00:00</b></span>
      <i></i>
      <span><small>cadence</small><b id="fps" class="num">25</b></span>
    </div>
    <span class="pill exp" id="exp-st" hidden><i></i><span></span></span>
    <span id="fen-pills"></span>
    <button class="tb go" id="b-export" title="ctrl+M">Exporter</button>
    <button class="ic" id="b-help" title="raccourcis">?</button>
  </div>

  <div class="warn conflict" id="conflict" hidden>
    <span>modifié ailleurs : vos derniers gestes ne sont pas enregistrés.</span>
    <button class="tb ghost sm" id="c-reload">Recharger celui du serveur</button>
    <button class="tb ghost sm" id="c-force">Garder le mien</button>
  </div>

  <div class="mtg-top">
    <!-- le panneau Projet : ce que le montage a pris dans la bibliothèque, ses dossiers, les séquences (projet.js) -->
    <section class="pan bin" aria-label="projet">
      <div class="pan-head">
        <div class="btabs" id="bin-tabs" role="tablist" aria-label="le projet et les dossiers ouverts"></div>
        <span class="sp"></span>
        <span class="lbl num" id="bin-n" title="objets montrés">0</span>
        <button class="ic sm" id="bin-newseq" title="nouvelle séquence (un clip lâché ici : à ses réglages)" aria-label="nouvelle séquence"><svg viewBox="0 0 24 24"><path d="M3 6h14v12H3zM3 10h14M3 14h14M20 9v6M17 12h6"/></svg></button>
        <button class="ic sm" id="bin-new" title="nouveau dossier · ctrl+B" aria-label="nouveau dossier"><svg viewBox="0 0 24 24"><path d="M3 7h6l2 2h10v10H3zM12 12v5M9.5 14.5h5"/></svg></button>
        <button class="ic sm" id="bin-up" title="importer · ctrl+I" aria-label="importer"><svg viewBox="0 0 24 24"><path d="M12 15V4M8 8l4-4 4 4M4 15v5h16v-5"/></svg></button>
        <input type="file" id="bin-file" multiple accept="video/*,image/*,audio/*" hidden>
      </div>
      <div class="bin-tools">
        <div class="seg" id="bin-kinds"></div>
        <input class="fld" id="bin-q" placeholder="chercher" aria-label="chercher dans le Projet">
      </div>
      <div class="bin-list" id="bin-list"></div>
    </section>

    <!-- le panneau Source : deux onglets, Effets (au départ) et Source -->
    <section class="pan mon src" id="src" aria-label="effets et moniteur source">
      <div class="mon-head">
        <div class="ptabs" id="src-tabs" role="tablist" aria-label="effets ou source">
          <button class="ptab on" data-tab="fx" role="tab" aria-selected="true">Effets</button>
          <button class="ptab" data-tab="src" role="tab" aria-selected="false">Source</button>
        </div>
        <span class="src-meta" id="src-meta" hidden><span class="mon-nm" id="src-name">—</span><span class="sp"></span><span class="lbl dur" id="s-dur"></span><span class="tcv" id="src-tc">00:00:00:00</span></span>
      </div>
      <div class="fx-pane" id="fx-pane"></div>
      <div class="src-pane" id="src-pane" hidden>
        <div class="screen" id="src-screen" draggable="true">
          <div class="empty"><b>Source</b><span>double-cliquez un plan du Projet</span></div>
        </div>
        <div class="scrub" id="src-scrub"><div class="rng" id="src-rng"></div><div class="pos" id="src-pos"></div></div>
        <div class="mon-foot">
          <button class="pb" id="s-play" title="espace">▶</button>
          <button class="pb" id="s-prev" title="←">◀</button>
          <button class="pb" id="s-next" title="→">▶</button>
          <button class="tb ghost sm" id="s-in" title="I">Entrée</button>
          <button class="tb ghost sm" id="s-out" title="O">Sortie</button>
          <span class="sp"></span>
          <button class="tb ghost sm" id="s-insert" title="virgule">Insérer</button>
          <button class="tb ghost sm" id="s-over" title="point">Écraser</button>
        </div>
      </div>
    </section>

    <!-- le programme -->
    <section class="pan mon prg" id="prg" aria-label="moniteur programme">
      <div class="mon-head"><span class="t">Programme</span><span class="mon-nm" id="prg-name">—</span><span class="sp"></span><span class="st" id="prg-state">arrêt</span></div>
      <div class="screen" id="prg-screen"><div class="stage" id="stage"><div class="empty" id="prg-empty"><b>Programme</b></div><div class="safe" id="safe" hidden><i></i><i></i></div></div></div>
      <div class="scrub" id="prg-scrub"><div class="fill" id="prg-fill"></div><div class="pos" id="prg-pos"></div></div>
      <div class="mon-foot">
        <span class="lbl">durée</span><span class="tcv sm" id="prg-dur">00:00:00:00</span><span class="sp"></span>
      </div>
    </section>

    <!-- l'inspecteur : le plan choisi, ou le projet -->
    <section class="pan inspw" id="inspw" aria-label="inspecteur">
      <div class="insp-head" id="insp-head"><span class="t">Inspecteur</span><span class="sp"></span></div>
      <aside class="insp" id="insp"></aside>
    </section>
  </div>

  <!-- la timeline -->
  <section class="pan tlw" aria-label="timeline">
    <div class="seqtabs" id="seq-tabs" role="tablist" aria-label="les séquences ouvertes"></div>
    <div class="tl-bar">
      <div class="tgrp tools" id="tools" role="toolbar" aria-label="outils (Premiere Pro)"></div>
      <span class="t">Timeline · <b id="tl-n" class="num">0</b> plans · <b id="tl-dur" class="tcv">00:00:00:00</b></span>
      <span class="sp"></span>
      <button class="tb ghost sm" id="b-cut" title="ctrl+K · toutes les pistes : ctrl+maj+K">Couper</button>
      <button class="tb ghost sm" id="b-xfade" title="ctrl+D">Fondu enchaîné</button>
      <button class="tb ghost sm" id="b-del" title="Suppr">Effacer</button>
      <button class="tb ghost sm" id="b-ripple" title="maj+Suppr">Raccorder</button>
      <span class="snapper" title="S">aimant<button class="sw on" id="b-snap" aria-pressed="true"><i></i></button></span>
      <div class="zoomer">
        <button id="z-out" title="dézoomer · −">−</button>
        <span id="z-val" class="num">100 %</span>
        <button id="z-in" title="zoomer · = · alt + molette">+</button>
        <button id="z-fit" title="tout le montage · \">tout</button>
      </div>
    </div>
    <div class="tl" id="tl"></div>
  </section>
</main>
</body>
</html>
